services:
    app:
        build: .
        container_name: tradielynx_api
        ports:
            - "8080:8080"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - .:/app
        environment:
            - CONFIG_PATH=/app/config.json
            - DB_USER=${POSTGRES_USER:?POSTGRES_USER is required - copy .env.example to .env}
            - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
            - DB_NAME=${POSTGRES_DB:?POSTGRES_DB is required - copy .env.example to .env}
            - DB_HOST=db
            - DB_PORT=5432
            - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
            - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}

    db:
        image: postgres:16
        container_name: tradielynx_db
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required - copy .env.example to .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required - copy .env.example to .env}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./internal/db/initial_db.sql:/docker-entrypoint-initdb.d/initial_db.sql
        ports:
            - "5432:5432"

volumes:
    pgdata:
