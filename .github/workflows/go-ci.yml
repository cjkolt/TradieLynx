name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ code generator
        run: go install github.com/a-h/templ/cmd/templ@v0.3.924

      - name: Generate Go templates
        run: $(go env GOPATH)/bin/templ generate

      - name: Run unit tests and compile packages
        run: go test ./...

      - name: Run static checks
        run: go vet ./...
