name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradielynx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradielynx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRADIELYNX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tradielynx_ci?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ code generator
        run: go install github.com/a-h/templ/cmd/templ@v0.3.924

      - name: Generate Go templates
        run: $(go env GOPATH)/bin/templ generate

      - name: Run unit tests and compile packages
        run: go test ./...

      - name: Run PostgreSQL integration tests
        run: go test -tags=integration -count=1 ./internal/repo

      - name: Run static checks
        run: go vet ./...

      - name: Build application
        run: go build ./cmd/app
